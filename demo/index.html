<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BlockNote Kit demo</title>
    <link rel="stylesheet" href="/build/main.css">
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f6; color: #1f2937; }
        main { max-width: 64rem; margin: 0 auto; padding: 1.5rem; display: grid; gap: 1.25rem; }
        h1 { font-size: 1.25rem; margin: 0; }
        .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; font-size: .875rem; }
        .controls button { padding: .4rem .7rem; border: 1px solid #d1d5db; border-radius: .375rem; background: #fff; cursor: pointer; }
        .controls button[aria-pressed="true"] { border-color: #4f46e5; color: #4f46e5; }
        pre { background: #111827; color: #e5e7eb; padding: 1rem; border-radius: .5rem; max-height: 16rem; overflow: auto; font-size: .75rem; }
    </style>
</head>
<body>
    <main>
        <h1>BlockNote Kit, no Filament</h1>
        <div id="app"></div>
    </main>
    <script type="module" src="/build/main.js"></script>
</body>
</html>
